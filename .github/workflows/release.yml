name: Release

# Triggers when you push a tag like v1.2.0:
#   git tag v1.2.0 && git push origin v1.2.0
#
# If the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD
# secrets are set, this publishes an R8-shrunk, release-signed APK.
# Otherwise it falls back to a debug-signed APK and flags a warning.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Check tag matches versionName
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' app/build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          ./gradlew assembleRelease
          rm -f "$KEYSTORE_FILE"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
             "release/PopItBubble-${GITHUB_REF_NAME}.apk"

      - name: Build debug APK (no signing secrets)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::Release signing secrets are not set; publishing a debug-signed APK."
          ./gradlew assembleDebug
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release/PopItBubble-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PopItBubble ${{ github.ref_name }}"
          generate_release_notes: true
          files: release/PopItBubble-*.apk
          fail_on_unmatched_files: true
